openapi: 3.0.3
info:
  title: JudeOS — принятый онлайн-контракт и каркас
  version: 0.1.0
  description: 'Контракт #16 принят пользователем (DECISIONS U2026-10-07-S0-01, PR #78 merged). Семь бизнес-операций
    запланированы; #19 реализует только служебные операции каркаса. Все данные синтетические. Источник
    контрактов — этот файл; runtime /openapi.json содержит только x-status implemented. Правила — api/README.md.'
  contact:
    url: https://github.com/StarMadeGalaxy/JudeOS/issues/16
servers:
- url: https://judeos.example
  description: Зарезервированный пример, не работающий сервис.
tags:
- name: access
  description: Вход и серверные сессии сотрудников.
- name: training
  description: Разрешённые занятия и сохранённый roster.
- name: attendance
  description: Отметки с версией, историей и безопасным повтором.
- name: operations
  description: Служебные проверки и локальная документация каркаса.
security:
- staffSession: []
paths:
  /api/v1/access/csrf:
    get:
      operationId: getCsrfToken
      tags:
      - access
      summary: Получить CSRF-токен
      description: 'Same-origin bootstrap: preauth 10 минут, сессия 8 часов абсолютного TTL без продления.
        Нет CORS; точный PUBLIC_ORIGIN HTTPS, сторонние Origin/Fetch Metadata отклоняются. Cookie Secure/HttpOnly/host-only.
        120 запросов/мин на peer IP; PostgreSQL bucket общий для процессов. CSRF хранится в памяти вкладки.'
      x-status: implemented
      x-issue: 21
      parameters: []
      responses:
        '200':
          description: Токен для памяти текущей вкладки.
          headers:
            Cache-Control: &id001
              description: Приватные данные и токены не кешируются.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
            X-Request-ID: &id002
              description: Безопасная корреляция диагностики; не секрет и не ID человека.
              schema:
                type: string
                minLength: 1
                maxLength: 100
              example: synthetic-request-001
            Set-Cookie:
              schema: &id003
                type: string
              description: Создаётся только анонимный preauth; действующая сессия не ротируется этим GET.
                HttpOnly cookie, не CSRF-токен.
              example: __Host-judeos-preauth=synthetic-preauth-secret; Secure; HttpOnly; SameSite=Lax;
                Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
              example:
                csrf_token: synthetic-csrf-token-0000000000000001
                expires_at: '2026-10-07T15:10:00Z'
        '403':
          $ref: '#/components/responses/Error403'
        '405':
          description: Метод не поддерживается; Allow содержит разрешённые методы этого пути.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Allow:
              schema:
                type: string
              description: Разрешённые методы этого конкретного пути.
              example: GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: METHOD_NOT_ALLOWED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
  /api/v1/access/login:
    post:
      operationId: loginStaff
      tags:
      - access
      summary: Войти как сотрудник
      description: 'Логин: trim + lowercase ASCII, 1–254 символа [a-z0-9._@+-], первый alphanumeric. Argon2id
        v19, 64 MiB, t=2,p=1; пароль до 1024 bytes, новый минимум 12 Unicode code points и максимум 1024 UTF-8 bytes. Preauth CSRF + точный Origin обязательны.
        LOGIN_FAILED одинаков для неизвестного/отозванного входа/неверного пароля. Лимит 10 попыток/15
        минут по login и peer IP, успешные попытки тоже считаются. Секрет сессии ротируется; preauth потребляется
        атомарно. TTL 8 часов; GET его не продлевает. После входа получить session CSRF заново. Повтор
        не идемпотентен.'
      x-status: implemented
      x-issue: 21
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Сессия создана; секрет только в cookie.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Set-Cookie:
              schema: *id003
              description: Непрозрачный синтетический пример. Secure; HttpOnly; SameSite=Lax; Path=/;
                без Domain.
              example: __Host-judeos-session=synthetic-session-secret; Secure; HttpOnly; SameSite=Lax;
                Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessSession'
              example: &id004
                account_id: 00000000-0000-4000-8000-000000000001
                expires_at: '2026-10-07T21:00:00Z'
                memberships:
                - membership_id: 00000000-0000-4000-8000-000000000201
                  tenant_id: 00000000-0000-4000-8000-000000000101
                  club_name: Синтетический клуб A
                  timezone: Europe/Minsk
                  grants:
                  - role: coach
                    scope: assigned_sessions
        '401':
          description: Нейтральный отказ входа.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: LOGIN_FAILED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '405':
          description: Метод не поддерживается; Allow содержит разрешённые методы этого пути.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Allow:
              schema:
                type: string
              description: Разрешённые методы этого конкретного пути.
              example: POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: METHOD_NOT_ALLOWED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        description: JSON, до 16 KiB; лишние поля и null вне nullable отклоняются.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: synthetic.coach
              password: synthetic-example-only
  /api/v1/access/session:
    get:
      operationId: getAccessSession
      tags:
      - access
      summary: Прочитать действующий вход
      description: Проверяет актуальную сессию/Account и возвращает только активные memberships и grants,
        без Person/Athlete/контактов. Меню не выдаёт прав; сервер проверяет каждый запрос заново. GET
        не продлевает TTL.
      x-status: implemented
      x-issue: 21
      parameters: []
      responses:
        '200':
          description: Метаданные действующего входа.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessSession'
              example: *id004
        '401':
          $ref: '#/components/responses/Error401'
        '405':
          description: Метод не поддерживается; Allow содержит разрешённые методы этого пути.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Allow:
              schema:
                type: string
              description: Разрешённые методы этого конкретного пути.
              example: GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: METHOD_NOT_ALLOWED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '403':
          $ref: '#/components/responses/Error403'
      security:
      - staffSession: []
  /api/v1/access/logout:
    post:
      operationId: logoutStaff
      tags:
      - access
      summary: Отозвать текущую сессию
      description: CSRF/Origin обязательны. Отзывает текущую сессию и очищает cookie. Повтор получает
        401. Для отзыва сотрудника используется PUT staff; глобальные сессии этого аккаунта также отзываются
        при reset/смене ролей/отзыве membership.
      x-status: implemented
      x-issue: 21
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Сессия отозвана; тела нет.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Set-Cookie:
              schema: *id003
              description: Непрозрачный синтетический пример. Secure; HttpOnly; SameSite=Lax; Path=/;
                без Domain.
              example: __Host-judeos-session=; Max-Age=0; Secure; HttpOnly; SameSite=Lax; Path=/
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '405':
          description: Метод не поддерживается; Allow содержит разрешённые методы этого пути.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Allow:
              schema:
                type: string
              description: Разрешённые методы этого конкретного пути.
              example: POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: METHOD_NOT_ALLOWED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security:
      - staffSession: []
  /api/v1/tenants/{tenant_id}/sessions:
    get:
      operationId: listAssignedSessions
      tags:
      - training
      summary: Получить назначенные занятия за дату
      description: 'Первый сценарий: активный coach с текущим SessionCoach в клубе; manager/administrator
        без такого grant/назначения не получают неявных прав. Фильтр date — локальная дата начала занятия
        Europe/Minsk, а не UTC; перенос сохраняет ID. Включены planned/in_progress/closed/cancelled для
        видимости отмены. Сортировка starts_at, session_id; cursor привязан к аккаунту, tenant, date и
        порядку, при смене фильтра 400. Каждая страница проверяет текущие права; список не snapshot, клиент
        объединяет по ID и обновляет после переноса. Весь клуб не выдаётся.'
      x-status: planned
      x-issue: 16
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Обязательная календарная дата в зоне клуба.
        example: '2026-10-07'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        description: Размер страницы, default 50; значения вне диапазона — 400.
        example: 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 2048
        description: Непрозрачный cursor из предыдущей страницы; отсутствует для первой.
      responses:
        '200':
          description: Разрешённые занятия; пустой список допустим.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
              examples:
                page:
                  value:
                    items:
                    - &id005
                      session_id: 00000000-0000-4000-8000-000000000501
                      tenant_id: 00000000-0000-4000-8000-000000000101
                      group:
                        id: 00000000-0000-4000-8000-000000000601
                        name: Тестовая группа
                      venue:
                        id: 00000000-0000-4000-8000-000000000602
                        name: Синтетический зал
                      starts_at: '2026-10-07T15:00:00Z'
                      ends_at: '2026-10-07T16:00:00Z'
                      state: in_progress
                      version: 1
                    next_cursor: null
                empty:
                  value:
                    items: []
                    next_cursor: null
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '405':
          description: Метод не поддерживается; Allow содержит разрешённые методы этого пути.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Allow:
              schema:
                type: string
              description: Разрешённые методы этого конкретного пути.
              example: GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: METHOD_NOT_ALLOWED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/tenants/{tenant_id}/sessions/{session_id}:
    get:
      operationId: getSessionJournal
      tags:
      - training
      summary: Прочитать занятие и сохранённый состав
      description: 'Только текущий назначенный coach, активное членство и grant assigned_sessions; чужое
        занятие — 404. Состав берётся из SessionRoster, не вычисляется по сегодняшней группе. Отмена/закрытие
        не удаляют отметки. Минимальный DTO содержит Person/Athlete ID, имя, участие, trial и отметку.
        Семья, контакты, допуск, платежи не включены; их контракт/права согласуются в #26. Архивирование
        и исторический доступ — открытое решение; данный сценарий не даёт права читать архивные карточки.'
      x-status: planned
      x-issue: 16
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Версия занятия и независимые версии отметок.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionJournal'
              example:
                session: *id005
                roster:
                - athlete_id: 00000000-0000-4000-8000-000000000401
                  person_id: 00000000-0000-4000-8000-000000000301
                  display_name: Тестовый спортсмен А
                  participation: regular
                  trial: false
                  attendance:
                    athlete_id: 00000000-0000-4000-8000-000000000401
                    status: unmarked
                    version: 0
                    recorded_at: null
                    recorded_by_account_id: null
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          description: Метод не поддерживается; Allow содержит разрешённые методы этого пути.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Allow:
              schema:
                type: string
              description: Разрешённые методы этого конкретного пути.
              example: GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: METHOD_NOT_ALLOWED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/tenants/{tenant_id}/sessions/{session_id}/attendance/{athlete_id}:
    put:
      operationId: setAttendance
      tags:
      - attendance
      summary: Сохранить одну отметку с проверкой версии
      description: 'Только активный coach, назначенный сейчас, и Athlete в SessionRoster этого tenant.
        Проверяются session state и неархивный Athlete в одной транзакции с эффектом/историей/OperationResult.
        cancelled — 409; planned/in_progress разрешены, closed — исправление текущим назначенным тренером.
        Полномочия менеджера/администратора и прежнего тренера не предполагаются (#26). base_version относится
        только к этой отметке; перенос/смена состава не вычисляются из клиентской версии. Автор/время
        берутся сервером. Новый принятый operation_id повышает версию на 1 даже при том же status и оставляет
        историю до/после. Та же команда сериализуется по (tenant, actor, operation_id) и возвращает прежний
        успешный/конфликтный результат после актуальной проверки scope/состояния; другой payload/target
        — 409 OPERATION_ID_REUSED. Type, /api/v1, target, base_version, status и нормализованная reason
        входят в hash. 401/403/404, невалидный ввод и отказ по актуальному состоянию не сохраняются как
        эффект. Конфликт версии сохраняется как терминальный результат ID; после явного решения нужен
        новый ID/base_version. Повтор не порождает новый аудит/уведомление. Ответ replay описывает исходный
        результат, не сегодняшнюю версию; перечитать журнал. Нет last-write-wins, финансовых эффектов
        или Telegram. Срок удаления результатов/ID и recovery — #18/#52; до их согласования синтетический
        сервис не удаляет результаты.'
      x-status: planned
      x-issue: 16
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AthleteId'
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Применено или повтор исходного успешного результата.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Operation-Replayed:
              schema:
                type: boolean
              description: true для сохранённого результата; false для первой принятой команды.
              example: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSaved'
              example:
                operation_id: 00000000-0000-4000-8000-000000000701
                attendance: &id006
                  athlete_id: 00000000-0000-4000-8000-000000000401
                  status: present
                  version: 1
                  recorded_at: '2026-10-07T15:03:00Z'
                  recorded_by_account_id: 00000000-0000-4000-8000-000000000001
        '409':
          description: Конфликт версии, повтор ID с другим payload или запрет записи по состоянию. Только
            версия возвращает current, после проверки прав.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Operation-Replayed:
              schema:
                type: boolean
              description: Присутствует для сохранённого результата конфликта версии; true на его повторе.
              example: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCommandConflict'
              examples:
                version:
                  value:
                    code: ATTENDANCE_VERSION_CONFLICT
                    message: Отметка уже изменена. Выберите, какое значение сохранить.
                    request_id: synthetic-request-002
                    operation_id: 00000000-0000-4000-8000-000000000702
                    current: *id006
                reused:
                  value:
                    code: OPERATION_ID_REUSED
                    message: Синтетический пример безопасной ошибки.
                    request_id: synthetic-request-001
                cancelled:
                  value:
                    code: SESSION_CANCELLED
                    message: Синтетический пример безопасной ошибки.
                    request_id: synthetic-request-001
                archived:
                  value:
                    code: ATHLETE_ARCHIVED
                    message: Синтетический пример безопасной ошибки.
                    request_id: synthetic-request-001
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          description: Метод не поддерживается; Allow содержит разрешённые методы этого пути.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Allow:
              schema:
                type: string
              description: Разрешённые методы этого конкретного пути.
              example: PUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: METHOD_NOT_ALLOWED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'

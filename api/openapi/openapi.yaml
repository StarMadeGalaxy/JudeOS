components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: __Host-judeos-session
      description: Серверная отзываемая сессия. Secure/HttpOnly/SameSite=Lax/Path=/; host-only; секрет не передаётся
        в JSON и не хранится в localStorage/IndexedDB.
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Кандидат клуба, проверяется через активный ClubMembership; не разрешение.
      example: 00000000-0000-4000-8000-000000000101
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Устойчивый ID занятия внутри проверенного tenant.
      example: 00000000-0000-4000-8000-000000000501
    AthleteId:
      name: athlete_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Athlete ID в сохранённом составе этого занятия; не Account/Person ID.
      example: 00000000-0000-4000-8000-000000000401
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
      description: Токен GET /access/csrf, связанный с preauth или действующей сессией; не сохранять на диске.
      example: synthetic-csrf-token-0000000000000001
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
        maxLength: 2048
      description: Точное совпадение с настроенным HTTPS origin; отсутствие/null отклоняется.
      example: https://judeos.example
    MembershipId:
      name: membership_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID сотрудника только в разрешённом tenant; чужой/отсутствующий ID не раскрывается.
      example: 00000000-0000-4000-8000-000000000201
  schemas:
    AttendanceStatus:
      type: string
      enum:
      - present
      - absent
      - sick
      - unmarked
      description: Был / Не был / Болел / Не отмечен. trial принадлежит roster.
    SessionState:
      type: string
      enum:
      - planned
      - in_progress
      - closed
      - cancelled
    Role:
      type: string
      enum:
      - administrator
      - manager
      - coach
      description: Роль в клубе; сама по себе не выдаёт предметные права.
    RoleGrant:
      type: object
      additionalProperties: false
      required:
      - role
      - scope
      properties:
        role:
          $ref: '#/components/schemas/Role'
        scope:
          type: string
          enum:
          - club
          - assigned_sessions
    Membership:
      type: object
      additionalProperties: false
      required:
      - membership_id
      - tenant_id
      - club_name
      - timezone
      - grants
      properties:
        membership_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        club_name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          type: string
          enum:
          - Europe/Minsk
        grants:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
          minItems: 1
        authority_source:
          type: string
          enum:
          - club
          - network_owner
          - platform
          description: Явное происхождение текущего доступа. membership_id сохраняет прямую активную запись;
            для derived-only области это read-only ID клуба, не цель staff mutation.
    AccessSession:
      type: object
      additionalProperties: false
      required:
      - account_id
      - expires_at
      - memberships
      properties:
        account_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
          pattern: Z$
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        networks:
          type: array
          items:
            $ref: '#/components/schemas/Network'
        platform_administrator:
          type: boolean
      description: Один вход; актуальные клубные и явные сетевые/платформенные права перечитываются из БД на
        каждом запросе. Старые клиенты могут не получать дополнительные organizational поля. Нельзя выводить
        сеть из названия клуба или administrator другого клуба. Сессия без memberships допускается только для действующего pending join и не даёт клубных прав до согласия.
    CsrfToken:
      type: object
      additionalProperties: false
      required:
      - csrf_token
      - expires_at
      properties:
        csrf_token:
          type: string
          minLength: 32
          maxLength: 256
        expires_at:
          type: string
          format: date-time
          pattern: Z$
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - login
      - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: trim/lowercase ASCII; первый [a-z0-9], остальные [a-z0-9._@+-].
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true
    NamedId:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
    TrainingSession:
      type: object
      additionalProperties: false
      required:
      - session_id
      - tenant_id
      - group
      - venue
      - starts_at
      - ends_at
      - state
      - version
      properties:
        session_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        group:
          $ref: '#/components/schemas/NamedId'
        venue:
          $ref: '#/components/schemas/NamedId'
        starts_at:
          type: string
          format: date-time
          description: UTC, RFC 3339 с Z; дата списка вычисляется в зоне клуба.
          pattern: Z$
        ends_at:
          type: string
          format: date-time
          pattern: Z$
        state:
          $ref: '#/components/schemas/SessionState'
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Версия состояния, времени, состава и назначений; не версия отметок.
    SessionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrainingSession'
        next_cursor:
          type: string
          nullable: true
          maxLength: 2048
          description: Непрозрачный cursor; null означает конец. Не snapshot при конкурентном переносе.
    Attendance:
      oneOf:
      - $ref: '#/components/schemas/UnrecordedAttendance'
      - $ref: '#/components/schemas/RecordedAttendance'
    RosterEntry:
      type: object
      additionalProperties: false
      required:
      - athlete_id
      - person_id
      - display_name
      - participation
      - trial
      - attendance
      properties:
        athlete_id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        participation:
          type: string
          enum:
          - regular
          - guest
          - visit
        trial:
          type: boolean
        attendance:
          $ref: '#/components/schemas/Attendance'
        primary_contact:
          $ref: '#/components/schemas/PrimaryContact'
        admission:
          $ref: '#/components/schemas/AdmissionSummary'
        excluded:
          type: boolean
          description: 'Принятый контракт #26: сохранённая исключённая строка; история/отметка остаются, новые
            отметки/контакт недоступны.'
    SessionJournal:
      type: object
      additionalProperties: false
      required:
      - session
      - roster
      properties:
        session:
          $ref: '#/components/schemas/TrainingSession'
        roster:
          type: array
          items:
            $ref: '#/components/schemas/RosterEntry'
    SetAttendanceRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - base_version
      - status
      properties:
        operation_id:
          type: string
          format: uuid
          description: Новый UUID для нового намерения; тот же ID и payload при сетевом повторе.
        base_version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        status:
          $ref: '#/components/schemas/AttendanceStatus'

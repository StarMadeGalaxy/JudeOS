openapi: 3.0.3
info:
  title: JudeOS — принятый онлайн-контракт и каркас
  version: 0.1.0
  description: 'Принятые #16/#20/#21 и wire #26/PR102 сохранены. People/access #27/PR111 интегрированы;
    текущий runtime требует schema12. Полный контракт:75 операций,72 implemented и3 planned,
    включая22 новые формы #29, согласованные для реализации; independent review ещё требуется.
    Семьи/телефоны/поступления не выдают прав; administrator клуба не получает другую сеть.
    Runtime публикует только implemented. Training API реализовано #29; отметки/закрытие/новые гости остаются planned,
    реальные данные/production/restore и публикация на judopride.tech не включены.'
  contact:
    url: https://github.com/StarMadeGalaxy/JudeOS/issues/16
servers:
- url: https://judeos.example
  description: Зарезервированный пример, не работающий сервис.
tags:
- name: access
  description: Вход и серверные сессии сотрудников.
- name: training
  description: Разрешённые занятия и сохранённый roster.
- name: attendance
  description: Отметки с версией, историей и безопасным повтором.
- name: people
  description: Реестр людей и проверенных связей #27 по принятому wire #26/PR102.
- name: operations
  description: Служебные проверки и локальная документация каркаса.
- name: networks
  description: 'Явные сети, организационные настройки и платформа #27.'
security:
- staffSession: []
paths:
  /api/v1/access/csrf:
    get:
      operationId: getCsrfToken
      tags:
      - access
      summary: Получить CSRF-токен
      description: 'Same-origin bootstrap: preauth 10 минут, сессия 8 часов абсолютного TTL без продления.
        Нет CORS; точный PUBLIC_ORIGIN HTTPS, сторонние Origin/Fetch Metadata отклоняются. Cookie Secure/HttpOnly/host-only.
        120 запросов/мин на peer IP; PostgreSQL bucket общий для процессов. CSRF хранится в памяти вкладки.'
      x-status: implemented
      x-issue: 21
      parameters: []
      responses:
        '200':
          description: Токен для памяти текущей вкладки.
          headers:
            Cache-Control: &id001
              description: Приватные данные и токены не кешируются.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
            X-Request-ID: &id002
              description: Безопасная корреляция диагностики; не секрет и не ID человека.
              schema:
                type: string
                minLength: 1
                maxLength: 100
              example: synthetic-request-001
            Set-Cookie:
              schema: &id003
                type: string
              description: Создаётся только анонимный preauth; действующая сессия не ротируется этим GET. HttpOnly
                cookie, не CSRF-токен.
              example: __Host-judeos-preauth=synthetic-preauth-secret; Secure; HttpOnly; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
              example:
                csrf_token: synthetic-csrf-token-0000000000000001
                expires_at: '2026-10-07T15:10:00Z'
        '403':
          $ref: '#/components/responses/Error403'
        '405':
          description: Метод не поддерживается; Allow содержит разрешённые методы этого пути.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Allow:
              schema:
                type: string
              description: Разрешённые методы этого конкретного пути.
              example: GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: METHOD_NOT_ALLOWED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
  /api/v1/access/login:
    post:
      operationId: loginStaff
      tags:
      - access
      summary: Войти как сотрудник
      description: 'Логин: trim + lowercase ASCII, 1–254 символа [a-z0-9._@+-], первый alphanumeric. Argon2id
        v19, 64 MiB, t=2,p=1; пароль до 1024 bytes, новый минимум 12 Unicode code points и максимум 1024 UTF-8
        bytes. Preauth CSRF + точный Origin обязательны. LOGIN_FAILED одинаков для неизвестного/отозванного
        входа/неверного пароля. Лимит 10 попыток/15 минут по login и peer IP, успешные попытки тоже считаются.
        Секрет сессии ротируется; preauth потребляется атомарно. TTL 8 часов; GET его не продлевает. После
        входа получить session CSRF заново. Повтор не идемпотентен. Если все права отозваны, действующий pending join допускает вход только для собственного согласия, с пустым списком клубов.'
      x-status: implemented
      x-issue: 21
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Сессия создана; секрет только в cookie.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Set-Cookie:
              schema: *id003
              description: Непрозрачный синтетический пример. Secure; HttpOnly; SameSite=Lax; Path=/; без Domain.
              example: __Host-judeos-session=synthetic-session-secret; Secure; HttpOnly; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessSession'
              example: &id004
                account_id: 00000000-0000-4000-8000-000000000001
                expires_at: '2026-10-07T21:00:00Z'
                memberships:
                - membership_id: 00000000-0000-4000-8000-000000000201
                  tenant_id: 00000000-0000-4000-8000-000000000101
                  club_name: Синтетический клуб A
                  timezone: Europe/Minsk
                  grants:
                  - role: coach
                    scope: assigned_sessions
        '401':
          description: Нейтральный отказ входа.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: LOGIN_FAILED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '405':
          description: Метод не поддерживается; Allow содержит разрешённые методы этого пути.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Allow:
              schema:
                type: string
              description: Разрешённые методы этого конкретного пути.
              example: POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: METHOD_NOT_ALLOWED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        description: JSON, до 16 KiB; лишние поля и null вне nullable отклоняются.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: synthetic.coach
              password: synthetic-example-only
  /api/v1/access/session:
    get:
      operationId: getAccessSession
      tags:
      - access
      summary: Прочитать действующий вход
      description: Проверяет актуальную сессию/Account и возвращает только активные memberships и grants, без
        Person/Athlete/контактов. Меню не выдаёт прав; сервер проверяет каждый запрос заново. GET не продлевает
        TTL.
      x-status: implemented
      x-issue: 21
      parameters: []
      responses:
        '200':
          description: Метаданные действующего входа.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessSession'
              example: *id004
        '401':
          $ref: '#/components/responses/Error401'
        '405':
          description: Метод не поддерживается; Allow содержит разрешённые методы этого пути.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Allow:
              schema:
                type: string
              description: Разрешённые методы этого конкретного пути.
              example: GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: METHOD_NOT_ALLOWED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '403':
          $ref: '#/components/responses/Error403'
      security:
      - staffSession: []
  /api/v1/access/logout:
    post:
      operationId: logoutStaff
      tags:
      - access
      summary: Отозвать текущую сессию
      description: CSRF/Origin обязательны. Отзывает текущую сессию и очищает cookie. Повтор получает 401.
        Для отзыва сотрудника используется PUT staff; глобальные сессии этого аккаунта также отзываются при
        reset/смене ролей/отзыве membership.
      x-status: implemented
      x-issue: 21
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Сессия отозвана; тела нет.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Set-Cookie:
              schema: *id003
              description: Непрозрачный синтетический пример. Secure; HttpOnly; SameSite=Lax; Path=/; без Domain.
              example: __Host-judeos-session=; Max-Age=0; Secure; HttpOnly; SameSite=Lax; Path=/
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '405':
          description: Метод не поддерживается; Allow содержит разрешённые методы этого пути.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Allow:
              schema:
                type: string
              description: Разрешённые методы этого конкретного пути.
              example: POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: METHOD_NOT_ALLOWED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security:
      - staffSession: []
  /api/v1/tenants/{tenant_id}/sessions:
    get:
      operationId: listAssignedSessions
      tags:
      - training
      summary: Получить назначенные занятия за дату
      description: 'Принятый #16: текущий назначенный coach. Роли #26 подтверждены: administrator видит занятия
        клуба своей сети, manager — назначенного ему клуба за дату; coach — только текущие назначения; название
        operationId сохраняется ради совместимости. planned/in_progress/closed/cancelled, локальная date Europe/Minsk,
        сортировка starts_at/session_id, cursor связан с actor/tenant/date; каждая страница проверяет актуальные
        grants. Бывшее назначение само по себе не даёт историю. Wire-расширение ожидает приёмки; представление
        сетевого разрешения согласуется с #21.'
      x-status: implemented
      x-issue: 16
      x-runtime-issue: 29
      x-runtime-source: https://github.com/StarMadeGalaxy/JudeOS/issues/29#issuecomment-6095187659
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Обязательная календарная дата в зоне клуба.
        example: '2026-10-07'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        description: Размер страницы, default 50; значения вне диапазона — 400.
        example: 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 2048
        description: Непрозрачный cursor из предыдущей страницы; отсутствует для первой.
      responses:
        '200':
          description: Разрешённые занятия; пустой список допустим.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
              examples:
                page:
                  value:
                    items:
                    - &id005
                      session_id: 00000000-0000-4000-8000-000000000501
                      tenant_id: 00000000-0000-4000-8000-000000000101
                      group:
                        id: 00000000-0000-4000-8000-000000000601
                        name: Тестовая группа
                      venue:
                        id: 00000000-0000-4000-8000-000000000602
                        name: Синтетический зал
                      starts_at: '2026-10-07T15:00:00Z'
                      ends_at: '2026-10-07T16:00:00Z'
                      state: in_progress
                      version: 1
                    next_cursor: null
                empty:
                  value:
                    items: []
                    next_cursor: null
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '405':
          description: Метод не поддерживается; Allow содержит разрешённые методы этого пути.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Allow:
              schema:
                type: string
              description: Разрешённые методы этого конкретного пути.
              example: GET, POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: METHOD_NOT_ALLOWED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-contract-status: accepted
      x-s1-business-source: https://github.com/StarMadeGalaxy/JudeOS/issues/26#issuecomment-6066552281
      x-s1-role-source: https://github.com/StarMadeGalaxy/JudeOS/issues/26#issuecomment-6066079471
      x-s1-issue: 26
      x-s1-source: https://github.com/StarMadeGalaxy/JudeOS/issues/26#issuecomment-6060282984
    post:
      operationId: createManualSession
      tags:
      - training
      summary: Создать ручное занятие с явным составом менеджера
      description: 'Технический wire #29 для независимого review. Менеджер/administrator разрешённого клуба, явный owner
        его сети или platform; coach запрещён. Текущие права/tenant проверяются до ссылок, версий и operation_id. CSRF/exact
        HTTPS Origin для записей. Полная семантика, история, UTC Z, лимиты и повтор — api/TRAINING-CONTRACT.md. Никакого
        расписания/генерации/отметок/гостей/допуска этим срезом.'
      x-status: implemented
      x-issue: 29
      x-runtime-source: https://github.com/StarMadeGalaxy/JudeOS/issues/29#issuecomment-6095187659
      x-contract-status: proposed
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '201':
          description: Синтетический пример; точные права/версии в TRAINING-CONTRACT.md.
          headers:
            Cache-Control:
              description: Приватные данные и токены не кешируются.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
            X-Request-ID:
              description: Безопасная корреляция диагностики; не секрет и не ID человека.
              schema:
                type: string
                minLength: 1
                maxLength: 100
              example: synthetic-request-001
            Operation-Replayed:
              description: true при возврате исходного результата после проверки текущих прав/состояния.
              schema:
                type: boolean
              example: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionJournal'
              example:
                session:
                  session_id: 00000000-0000-4000-8000-000000000501
                  tenant_id: 00000000-0000-4000-8000-000000000101
                  group:
                    id: 00000000-0000-4000-8000-000000000703
                    name: Синтетическая группа
                  venue:
                    id: 00000000-0000-4000-8000-000000000701
                    name: Синтетический Venue
                  starts_at: '2026-10-10T15:00:00Z'
                  ends_at: '2026-10-10T16:00:00Z'
                  state: planned
                  version: 1
                roster:
                - athlete_id: 00000000-0000-4000-8000-000000000401
                  person_id: 00000000-0000-4000-8000-000000000301
                  display_name: Тестовый спортсмен А
                  participation: regular
                  trial: false
                  attendance:
                    athlete_id: 00000000-0000-4000-8000-000000000401
                    status: unmarked
                    version: 0
                    recorded_at: null
                    recorded_by_account_id: null
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          description: Метод не поддерживается; Allow содержит разрешённые методы этого пути.
          headers:
            Cache-Control:
              description: Приватные данные и токены не кешируются.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
            X-Request-ID:
              description: Безопасная корреляция диагностики; не секрет и не ID человека.
              schema:
                type: string
                minLength: 1
                maxLength: 100
              example: synthetic-request-001
            Allow:
              schema:
                type: string
              description: Разрешённые методы этого конкретного пути.
              example: GET, POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: METHOD_NOT_ALLOWED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          description: Синтетический пример; точные права/версии в TRAINING-CONTRACT.md.
          headers:
            Cache-Control:
              description: Приватные данные и токены не кешируются.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
            X-Request-ID:
              description: Безопасная корреляция диагностики; не секрет и не ID человека.
              schema:
                type: string
                minLength: 1
                maxLength: 100
              example: synthetic-request-001
            Operation-Replayed:
              description: true при возврате исходного результата после проверки текущих прав/состояния.
              schema:
                type: boolean
              example: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingCommandConflict'
              example:
                code: ENTITY_VERSION_CONFLICT
                message: Синтетический конфликт версии.
                request_id: synthetic-request-029
                operation_id: 00000000-0000-4000-8000-000000000708
                current_version: 2
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
      security:
      - staffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManualSessionRequest'
            example:
              operation_id: 00000000-0000-4000-8000-000000000708
              group_id: 00000000-0000-4000-8000-000000000703
              group_base_version: 1
              venue_id: 00000000-0000-4000-8000-000000000701
              starts_at: '2026-10-10T15:00:00Z'
              ends_at: '2026-10-10T16:00:00Z'
              roster:
              - athlete_id: 00000000-0000-4000-8000-000000000401
                trial: false
              coach_membership_ids:
              - 00000000-0000-4000-8000-000000000707
  /api/v1/tenants/{tenant_id}/sessions/{session_id}:
    get:
      operationId: getSessionJournal
      tags:
      - training
      summary: Прочитать занятие и сохранённый состав
      description: 'Принятый #16: минимальный журнал текущего назначенного coach. Область #26 подтверждена:
        administrator читает журнал клуба своей сети, manager — назначенного ему клуба; coach только при текущем
        назначении. DTO добавляет optional primary_contact (имя и телефон выбранного сейчас проверенного представителя),
        admission без диагноза и excluded. Старое минимальное DTO #16 сохраняется как совместимый формат. null
        контакт при отсутствии/истечении/отзыве; fallback запрещён. Семьи, другие представители, основание
        проверки, финансы, дата рождения не выдаются. Архивный/исключённый участник сохраняет допустимые факты,
        но контакт/admission не выдаются. История не создаёт бессрочного доступа. Область ролей подтверждена;
        wire и новые поля приняты в #102, сетевая область принята #27; #29 не выдаёт optional contact/admission.'

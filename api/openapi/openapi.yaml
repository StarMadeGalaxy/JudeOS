      summary: Сохранить одну отметку с проверкой версии
      description: 'Принятый #16: активный coach, назначенный сейчас, и Athlete в SessionRoster этого tenant.
        Проверяются session state и неархивный Athlete в одной транзакции с эффектом/историей/OperationResult.
        cancelled — 409; planned/in_progress разрешены, closed — исправление текущим назначенным тренером.  base_version
        относится только к этой отметке; перенос/смена состава не вычисляются из клиентской версии. Автор/время
        берутся сервером. Новый принятый operation_id повышает версию на 1 даже при том же status и оставляет
        историю до/после. Та же команда сериализуется по (tenant, actor, operation_id) и возвращает прежний
        успешный/конфликтный результат после актуальной проверки scope/состояния; другой payload/target — 409
        OPERATION_ID_REUSED. Type, /api/v1, target, base_version, status и нормализованная reason входят в
        hash. 401/403/404, невалидный ввод и отказ по актуальному состоянию не сохраняются как эффект. Конфликт
        версии сохраняется как терминальный результат ID; после явного решения нужен новый ID/base_version.
        Повтор не порождает новый аудит/уведомление. Ответ replay описывает исходный результат, не сегодняшнюю
        версию; перечитать журнал. Нет last-write-wins, финансовых эффектов или Telegram. Срок удаления результатов/ID
        и recovery — #18/#52; до их согласования синтетический сервис не удаляет результаты. Права #26: administrator
        клуба своей сети / manager назначенного клуба также ставит/исправляет существующие отметки, включая
        closed; coach — текущий назначенный. Исключённая строка — 404, cancelled/архив по прежним кодам. Снятие
        coach не снимает отдельную административную роль. Wire-расширение требует приёмки и не является действующим
        API; сетевое разрешение согласуется с #21.'

components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: __Host-judeos-session
      description: Серверная отзываемая сессия. Secure/HttpOnly/SameSite=Lax/Path=/; host-only; секрет
        не передаётся в JSON и не хранится в localStorage/IndexedDB.
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Кандидат клуба, проверяется через активный ClubMembership; не разрешение.
      example: 00000000-0000-4000-8000-000000000101
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Устойчивый ID занятия внутри проверенного tenant.
      example: 00000000-0000-4000-8000-000000000501
    AthleteId:
      name: athlete_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Athlete ID в сохранённом составе этого занятия; не Account/Person ID.
      example: 00000000-0000-4000-8000-000000000401
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
      description: Токен GET /access/csrf, связанный с preauth или действующей сессией; не сохранять на
        диске.
      example: synthetic-csrf-token-0000000000000001
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
        maxLength: 2048
      description: Точное совпадение с настроенным HTTPS origin; отсутствие/null отклоняется.
      example: https://judeos.example
    MembershipId:
      name: membership_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID сотрудника только в разрешённом tenant; чужой/отсутствующий ID не раскрывается.
      example: 00000000-0000-4000-8000-000000000201
  schemas:
    AttendanceStatus:
      type: string
      enum:
      - present
      - absent
      - sick
      - unmarked
      description: Был / Не был / Болел / Не отмечен. trial принадлежит roster.
    SessionState:
      type: string
      enum:
      - planned
      - in_progress
      - closed
      - cancelled
    Role:
      type: string
      enum:
      - administrator
      - manager
      - coach
      description: Роль в клубе; сама по себе не выдаёт предметные права.
    RoleGrant:
      type: object
      additionalProperties: false
      required:
      - role
      - scope
      properties:
        role:
          $ref: '#/components/schemas/Role'
        scope:
          type: string
          enum:
          - club
          - assigned_sessions
    Membership:
      type: object
      additionalProperties: false
      required:
      - membership_id
      - tenant_id
      - club_name
      - timezone
      - grants
      properties:
        membership_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        club_name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          type: string
          enum:
          - Europe/Minsk
        grants:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
          minItems: 1
    AccessSession:
      type: object
      additionalProperties: false
      required:
      - account_id
      - expires_at
      - memberships
      properties:
        account_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
          pattern: Z$
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    CsrfToken:
      type: object
      additionalProperties: false
      required:
      - csrf_token
      - expires_at
      properties:
        csrf_token:
          type: string
          minLength: 32
          maxLength: 256
        expires_at:
          type: string
          format: date-time
          pattern: Z$
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - login
      - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: trim/lowercase ASCII; первый [a-z0-9], остальные [a-z0-9._@+-].
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true
    NamedId:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
    TrainingSession:
      type: object
      additionalProperties: false
      required:
      - session_id
      - tenant_id
      - group
      - venue
      - starts_at
      - ends_at
      - state
      - version
      properties:
        session_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        group:
          $ref: '#/components/schemas/NamedId'
        venue:
          $ref: '#/components/schemas/NamedId'
        starts_at:
          type: string
          format: date-time
          description: UTC, RFC 3339 с Z; дата списка вычисляется в зоне клуба.
          pattern: Z$
        ends_at:
          type: string
          format: date-time
          pattern: Z$
        state:
          $ref: '#/components/schemas/SessionState'
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Версия состояния, времени, состава и назначений; не версия отметок.
    SessionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrainingSession'
        next_cursor:
          type: string
          nullable: true
          maxLength: 2048
          description: Непрозрачный cursor; null означает конец. Не snapshot при конкурентном переносе.
    Attendance:
      oneOf:
      - $ref: '#/components/schemas/UnrecordedAttendance'
      - $ref: '#/components/schemas/RecordedAttendance'
    RosterEntry:
      type: object
      additionalProperties: false
      required:
      - athlete_id
      - person_id
      - display_name
      - participation
      - trial
      - attendance
      properties:
        athlete_id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        participation:
          type: string
          enum:
          - regular
          - guest
          - visit
        trial:
          type: boolean
        attendance:
          $ref: '#/components/schemas/Attendance'
    SessionJournal:
      type: object
      additionalProperties: false
      required:
      - session
      - roster
      properties:
        session:
          $ref: '#/components/schemas/TrainingSession'
        roster:
          type: array
          items:
            $ref: '#/components/schemas/RosterEntry'
    SetAttendanceRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - base_version
      - status
      properties:
        operation_id:
          type: string
          format: uuid
          description: Новый UUID для нового намерения; тот же ID и payload при сетевом повторе.
        base_version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        status:
          $ref: '#/components/schemas/AttendanceStatus'
        reason:
          type: string
          maxLength: 500
          description: Необязательная причина; отсутствие и пустая строка нормализуются одинаково; null
            запрещён.
    AttendanceSaved:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - attendance
      properties:
        operation_id:
          type: string
          format: uuid
        attendance:
          $ref: '#/components/schemas/Attendance'
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - UNAUTHENTICATED
          - LOGIN_FAILED
          - CSRF_REJECTED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - UNSUPPORTED_MEDIA_TYPE
          - PAYLOAD_TOO_LARGE
          - OPERATION_ID_REUSED
          - SESSION_CANCELLED
          - ATHLETE_ARCHIVED
          - RATE_LIMITED
          - INTERNAL_ERROR
          - SERVICE_UNAVAILABLE
          - SESSION_EXPIRED
          - ACCESS_DENIED
          - ACCESS_CONFLICT
          - LINK_INVALID
        message:
          type: string
          minLength: 1
          maxLength: 300
        request_id:
          type: string
          minLength: 1
          maxLength: 100
    AttendanceConflict:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      - operation_id
      - current
      properties:
        code:
          type: string
          enum:
          - ATTENDANCE_VERSION_CONFLICT
        message:
          type: string
          minLength: 1
          maxLength: 300
        request_id:
          type: string
          minLength: 1
          maxLength: 100
        operation_id:
          type: string
          format: uuid
        current:
          $ref: '#/components/schemas/Attendance'
    AttendanceCommandConflict:
      oneOf:
      - $ref: '#/components/schemas/Error'
      - $ref: '#/components/schemas/AttendanceConflict'
    UnrecordedAttendance:
      type: object
      additionalProperties: false
      required:
      - athlete_id
      - status
      - version
      - recorded_at
      - recorded_by_account_id
      properties:
        athlete_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - unmarked
        version:
          type: integer
          minimum: 0
          maximum: 0
        recorded_at:
          type: string
          format: date-time
          nullable: true
          enum:
          - null
        recorded_by_account_id:
          type: string
          format: uuid
          nullable: true
          enum:
          - null
    RecordedAttendance:
      type: object
      additionalProperties: false
      required:
      - athlete_id
      - status
      - version
      - recorded_at
      - recorded_by_account_id
      properties:
        athlete_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AttendanceStatus'
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        recorded_at:
          type: string
          format: date-time
          pattern: Z$
        recorded_by_account_id:
          type: string
          format: uuid
    AccessLink:
      type: object
      additionalProperties: false
      required:
      - token
      - expires_at
      properties:
        token:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Секрет показывается один раз для ручной передачи; не логировать и не хранить на
            диске.
        expires_at:
          type: string
          format: date-time
          pattern: Z$
    RedeemRequest:
      type: object
      additionalProperties: false
      required:
      - token
      - password
      properties:
        token:
          type: string
          pattern: ^[a-f0-9]{64}$
        password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
          writeOnly: true
    InviteRequest:
      type: object
      additionalProperties: false
      required:
      - login
      - grants
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: trim/lowercase ASCII; первый [a-z0-9], остальные [a-z0-9._@+-].
        grants:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/RoleGrant'
    StaffChange:
      type: object
      additionalProperties: false
      required:
      - active
      - grants
      properties:
        active:
          type: boolean
        grants:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/RoleGrant'
    StaffMember:
      type: object
      additionalProperties: false
      required:
      - membership_id
      - account_id
      - login
      - active
      - grants
      properties:
        membership_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        login:
          type: string
        active:
          type: boolean
        grants:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
    StaffPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffMember'
  responses:
    Error403:
      description: Нет разрешения или проверка CSRF/Origin отклонена.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: FORBIDDEN
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
            csrf:
              value:
                code: CSRF_REJECTED
                message: Синтетический пример безопасной ошибки.
                request_id: synthetic-request-001
    Error429:
      description: Ограничение частоты; Retry-After задаёт секунды ожидания.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Число секунд до следующей попытки.
          example: 5
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: Синтетический пример безопасной ошибки.
            request_id: synthetic-request-001
    Error500:
      description: Безопасная внутренняя ошибка; результат записи может быть неизвестен клиенту.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Синтетический пример безопасной ошибки.
            request_id: synthetic-request-001
    Error503:
      description: Временная недоступность; для команды результат может быть неизвестен. Повторить тот
        же ID/payload.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Число секунд до следующей попытки.
          example: 5
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SERVICE_UNAVAILABLE
            message: Синтетический пример безопасной ошибки.
            request_id: synthetic-request-001
    Error400:
      description: Некорректный JSON, неизвестное/лишнее поле, UUID, дата или cursor.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_REQUEST
            message: Синтетический пример безопасной ошибки.
            request_id: synthetic-request-001
    Error413:
      description: Тело запроса превышает 16 KiB.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PAYLOAD_TOO_LARGE
            message: Синтетический пример безопасной ошибки.
            request_id: synthetic-request-001
    Error415:
      description: Требуется application/json; form и text/plain не принимаются.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNSUPPORTED_MEDIA_TYPE
            message: Синтетический пример безопасной ошибки.
            request_id: synthetic-request-001
    Error401:
      description: Нет действующей сессии; истечение или отзыв. Никаких профилей в ответе.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHENTICATED
            message: Синтетический пример безопасной ошибки.
            request_id: synthetic-request-001
    Error404:
      description: Объект отсутствует или вне разрешённого scope; существование чужого объекта не раскрывается.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Синтетический пример безопасной ошибки.
            request_id: synthetic-request-001
    Error409:
      description: Конфликт доступа, включая защиту последнего владельца.
      headers:
        Cache-Control:
          description: Приватные данные и токены не кешируются.
          schema:
            type: string
            enum:
            - no-store
          example: no-store
        X-Request-ID:
          description: Безопасная корреляция диагностики; не секрет и не ID человека.
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: synthetic-request-001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: ACCESS_CONFLICT
            message: Синтетический пример безопасной ошибки.
            request_id: synthetic-request-001

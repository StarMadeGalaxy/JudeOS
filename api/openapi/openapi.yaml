components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: __Host-judeos-session
      description: Серверная отзываемая сессия. Secure/HttpOnly/SameSite=Lax/Path=/;
        host-only; секрет не передаётся в JSON и не хранится в localStorage/IndexedDB.
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Кандидат клуба, проверяется через активный ClubMembership; не разрешение.
      example: 00000000-0000-4000-8000-000000000101
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Устойчивый ID занятия внутри проверенного tenant.
      example: 00000000-0000-4000-8000-000000000501
    AthleteId:
      name: athlete_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Athlete ID в сохранённом составе этого занятия; не Account/Person
        ID.
      example: 00000000-0000-4000-8000-000000000401
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
      description: Токен GET /access/csrf, связанный с preauth или действующей сессией;
        не сохранять на диске.
      example: synthetic-csrf-token-0000000000000001
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
        maxLength: 2048
      description: Точное совпадение с настроенным HTTPS origin; отсутствие/null отклоняется.
      example: https://judeos.example
  schemas:
    AttendanceStatus:
      type: string
      enum:
      - present
      - absent
      - sick
      - unmarked
      description: Был / Не был / Болел / Не отмечен. trial принадлежит roster.
    SessionState:
      type: string
      enum:
      - planned
      - in_progress
      - closed
      - cancelled
    Role:
      type: string
      enum:
      - administrator
      - manager
      - coach
      description: Роль в клубе; сама по себе не выдаёт предметные права.
    RoleGrant:
      type: object
      additionalProperties: false
      required:
      - role
      - scope
      properties:
        role:
          $ref: '#/components/schemas/Role'
        scope:
          type: string
          enum:
          - club
          - assigned_sessions
    Membership:
      type: object
      additionalProperties: false
      required:
      - membership_id
      - tenant_id
      - club_name
      - timezone
      - grants
      properties:
        membership_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        club_name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          type: string
          enum:
          - Europe/Minsk
        grants:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
          minItems: 1
    AccessSession:
      type: object
      additionalProperties: false
      required:
      - account_id
      - expires_at
      - memberships
      properties:
        account_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
          pattern: Z$
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    CsrfToken:
      type: object
      additionalProperties: false
      required:
      - csrf_token
      - expires_at
      properties:
        csrf_token:
          type: string
          minLength: 32
          maxLength: 256
        expires_at:
          type: string
          format: date-time
          pattern: Z$
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - login
      - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
          description: 'Идентификатор входа сотрудника; конкретная нормализация согласуется
            в #21.'
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true
    NamedId:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
    TrainingSession:
      type: object
      additionalProperties: false
      required:
      - session_id
      - tenant_id
      - group
      - venue
      - starts_at
      - ends_at
      - state
      - version
      properties:
        session_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        group:
          $ref: '#/components/schemas/NamedId'
        venue:
          $ref: '#/components/schemas/NamedId'
        starts_at:
          type: string
          format: date-time
          description: UTC, RFC 3339 с Z; дата списка вычисляется в зоне клуба.
          pattern: Z$
        ends_at:
          type: string
          format: date-time
          pattern: Z$
        state:
          $ref: '#/components/schemas/SessionState'
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Версия состояния, времени, состава и назначений; не версия
            отметок.
    SessionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrainingSession'
        next_cursor:
          type: string
          nullable: true
          maxLength: 2048
          description: Непрозрачный cursor; null означает конец. Не snapshot при конкурентном
            переносе.
    Attendance:
      oneOf:
      - $ref: '#/components/schemas/UnrecordedAttendance'
      - $ref: '#/components/schemas/RecordedAttendance'
    RosterEntry:
      type: object
      additionalProperties: false
      required:
      - athlete_id
      - person_id
      - display_name
      - participation
      - trial
      - attendance
      properties:
        athlete_id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        participation:
          type: string
          enum:
          - regular
          - guest
          - visit
        trial:
          type: boolean
        attendance:
          $ref: '#/components/schemas/Attendance'
        primary_contact:
          $ref: '#/components/schemas/PrimaryContact'
        admission:
          $ref: '#/components/schemas/AdmissionSummary'
        excluded:
          type: boolean
          description: 'Предложение #26: сохранённая исключённая строка; история/отметка остаются, новые отметки/контакт
            недоступны.'
    SessionJournal:
      type: object
      additionalProperties: false
      required:
      - session
      - roster
      properties:
        session:
          $ref: '#/components/schemas/TrainingSession'
        roster:
          type: array
          items:
            $ref: '#/components/schemas/RosterEntry'
    SetAttendanceRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - base_version
      - status
      properties:
        operation_id:
          type: string
          format: uuid
          description: Новый UUID для нового намерения; тот же ID и payload при сетевом
            повторе.
        base_version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        status:
          $ref: '#/components/schemas/AttendanceStatus'
        reason:
          type: string
          maxLength: 500
          description: Необязательная причина; отсутствие и пустая строка нормализуются
            одинаково; null запрещён.
    AttendanceSaved:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - attendance
      properties:
        operation_id:
          type: string
          format: uuid
        attendance:
          $ref: '#/components/schemas/Attendance'
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - UNAUTHENTICATED
          - LOGIN_FAILED
          - CSRF_REJECTED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - UNSUPPORTED_MEDIA_TYPE
          - PAYLOAD_TOO_LARGE
          - OPERATION_ID_REUSED
          - SESSION_CANCELLED
          - ATHLETE_ARCHIVED
          - RATE_LIMITED
          - INTERNAL_ERROR
          - SERVICE_UNAVAILABLE
        message:
          type: string
          minLength: 1
          maxLength: 300
        request_id:
          type: string
          minLength: 1
          maxLength: 100
    AttendanceConflict:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      - operation_id
      - current
      properties:
        code:
          type: string
          enum:
          - ATTENDANCE_VERSION_CONFLICT
        message:
          type: string
          minLength: 1
          maxLength: 300
        request_id:
          type: string
          minLength: 1
          maxLength: 100
        operation_id:
          type: string
          format: uuid
        current:
          $ref: '#/components/schemas/Attendance'
    AttendanceCommandConflict:
      oneOf:
      - $ref: '#/components/schemas/Error'
      - $ref: '#/components/schemas/AttendanceConflict'
    UnrecordedAttendance:
      type: object
      additionalProperties: false
      required:
      - athlete_id
      - status
      - version
      - recorded_at
      - recorded_by_account_id
      properties:
        athlete_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - unmarked
        version:
          type: integer
          minimum: 0
          maximum: 0
        recorded_at:
          type: string
          format: date-time
          nullable: true
          enum:
          - null
        recorded_by_account_id:
          type: string
          format: uuid
          nullable: true
          enum:
          - null
    RecordedAttendance:
      type: object
      additionalProperties: false
      required:
      - athlete_id
      - status
      - version
      - recorded_at
      - recorded_by_account_id
      properties:
        athlete_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AttendanceStatus'
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        recorded_at:
          type: string
          format: date-time
          pattern: Z$
        recorded_by_account_id:
          type: string
          format: uuid
    CreatePersonRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - display_name
      properties:
        operation_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        phone:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
          pattern: \S
          description: Необязательный номер; null — доступного номера нет. Номер не доказывает связь или права.
      description: 'Предложение #26: полное отображаемое имя одной строкой; телефоны необязательны. Нет даты рождения,
        Account или автоматического разбора имени.'
    PersonProfile:
      type: object
      additionalProperties: false
      required:
      - person_id
      - tenant_id
      - display_name
      - archived
      - version
      properties:
        person_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        phone:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
          pattern: \S
          description: Необязательный номер; null — доступного номера нет. Номер не доказывает связь или права.
        archived:
          type: boolean
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    CreateAthleteRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - person_id
      - participation
      properties:
        operation_id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        participation:
          type: string
          enum:
          - regular
          - guest
    GuardianLink:
      type: object
      additionalProperties: false

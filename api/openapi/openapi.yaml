      summary: Выдать ссылку восстановления общего входа
      description: 'Только действующий администратор платформы после ручной проверки личности получателя.
        Точный нормализованный login — selector, не доказательство личности; семья/телефон/роль administrator
        клуба или owner сети права выдачи не дают. CSRF/Origin обязательны, JSON16KiB, shared PostgreSQL120/minute.
        identity_verified должен быть true. Только уже настроенный, не disabled вход; неизвестный/pending/disabled
        даёт нейтральный400 LINK_INVALID. Случайный token показывается один раз, в БД hash; TTL30 минут.
        Повтор не идемпотентен: заменяет предыдущую ссылку, при потере ответа явно выдайте новую. Получатель
        использует public access/redeem с preauth CSRF; повторно проверяются состояние входа и platform-полномочия
        выдавшего. Смена пароля атомарно гасит все сеансы/ссылки входа и пишет metadata audit, без изменения/активации
        назначений. Нет email/Telegram отправки, резервных кодов или автоматического подтверждения личности.
        Аварийная операторская команда не HTTP endpoint. Источник решения: https://github.com/StarMadeGalaxy/JudeOS/issues/27#issuecomment-6084409663.'

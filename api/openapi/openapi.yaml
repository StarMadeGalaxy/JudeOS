        все сессии и ссылки аккаунта; не создаёт сессию автоматически. После успеха войти. 10 попыток/15 минут
        peer IP. Передать token в JSON; ссылка UI использует fragment, не query. #27: явный operator platform
        bootstrap использует этот же install endpoint для первого отдельного платформенного администратора.
        join-ссылки готового входа здесь всегда отклоняются и никогда не меняют пароль. Клубный reset повторно проверяет отсутствие owner/platform и назначений других клубов, включая действующие pending; при расширении области старый token отклоняется. Общий recovery30 минут выдаёт platform после ручной проверки; операторская ссылка восстанавливает только действующего platform. Redeem повторно проверяет полномочия выдавшего, не активирует отозванные назначения, гасит все сеансы и прежние ссылки атомарно с metadata audit.'

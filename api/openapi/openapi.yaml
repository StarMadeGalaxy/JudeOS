    get:
      operationId: listNetworks
      tags:
      - networks
      summary: Доступные сети
      description: 'Платформенные команды требуют отдельного platform grant. Создание сети из клуба требует
        administrator именно этого ещё не связанного клуба и включает только его. Владельцы управляют своими
        сетями; готовый login владельца назначается явно, изменение отзывает его сессии; последний владелец/платформенный
        administrator защищены. Клубы между сетями не переносятся. staff/assignments разрешён manager только
        для coach; manager не меняет более широкие права. Готовый вход получает join-токен и принимает его
        собственной сессией без установки пароля. Новый вход получает invite-токен для прежнего install-потока;
        истёкший/чужой/повторный join отклоняется. Один серверный вход #21. Явный owner действует только в
        своей сети; отдельный platform administrator — во всех сетях. Права перечитываются под общими с клубными
        командами блокировками. CSRF/Origin обязательны для команд. Аудит только metadata. Сетевые POST создают
        новый ID: при неизвестном результате сначала обновите список, не выполняйте автоматический повтор.
        Изменение названия/адреса требует base_version; 409 не делает частичного эффекта.'
